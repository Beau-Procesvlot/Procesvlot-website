:root{--bg:#020b1a;--c:#3fd0ff;--c2:#1a8cff;--dim:#0e3a5c;--txt:#cfefff;--warn:#ffb347;--bad:#ff5a5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Rajdhani,sans-serif}
#bg{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center}

.abs{position:absolute}
.fade{transition:opacity .6s}
.hidden{opacity:0!important;pointer-events:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes blink{50%{opacity:.25}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
svg.wires{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;overflow:visible}
.wire{stroke:var(--c);stroke-width:1.2;fill:none;opacity:.55;stroke-dasharray:5 7;animation:flow 2.5s linear infinite}

/* ronde kanaalbubbels */
.node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:3}
.node .ring{width:112px;height:112px;border-radius:50%;border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 18px #3fd0ff55,inset 0 0 18px #3fd0ff33;background:#03203aee;position:relative;transition:transform .3s,box-shadow .3s}
.node .ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px dashed #3fd0ff88;animation:spin 14s linear infinite}
.node .ring::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid transparent;border-top-color:#3fd0ff99;animation:spinr 6s linear infinite}
.node:hover .ring{transform:scale(1.08);box-shadow:0 0 34px #3fd0ffaa,inset 0 0 22px #3fd0ff55}
.node .ico{font-size:26px;color:var(--c)}
.node .lbl{font-family:Orbitron;font-size:11px;letter-spacing:2px;margin-top:5px}
.node .sub{font-size:13px;opacity:.7}
.node.small .ring{width:100px;height:100px}
.node.small .lbl{font-size:10px}
.badge{position:absolute;top:2px;right:2px;background:var(--warn);color:#201000;border-radius:10px;font-size:12px;padding:0 6px;font-weight:600}

/* rechthoekige HUD-vakken */
.box{position:absolute;border:1px solid #3fd0ff66;background:#021a2ecc;padding:26px 12px 10px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);z-index:2}
.box::before{content:attr(data-t);position:absolute;left:0;top:0;right:0;height:18px;background:#3fd0ff22;border-bottom:1px solid #3fd0ff55;font-family:Orbitron;font-size:10px;letter-spacing:2px;color:var(--c);padding:3px 0 0 18px}
.box::after{content:attr(data-id);position:absolute;right:10px;top:3px;font-family:'Share Tech Mono';font-size:10px;opacity:.55}
.box .k{font-family:Orbitron;font-size:22px;color:#e6fbff;text-shadow:0 0 10px var(--c)}
.mono{font-family:'Share Tech Mono';font-size:12px}
.up{color:var(--c)}.down{color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:2px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c);box-shadow:0 0 6px var(--c)}
.dot.w{background:var(--warn);box-shadow:0 0 6px var(--warn)}.dot.b{background:var(--bad);box-shadow:0 0 6px var(--bad);animation:blink 1s infinite}
.minibar{height:4px;background:var(--dim);position:relative;margin:3px 0 6px}
.minibar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 6px var(--c);transition:width 1.2s}

/* kern */
#core{position:absolute;left:630px;top:210px;width:340px;height:340px;cursor:pointer;z-index:5}
#core svg{width:100%;height:100%;overflow:visible}
.r1{animation:spin 20s linear infinite;transform-origin:150px 150px}
.r2{animation:spinr 12s linear infinite;transform-origin:150px 150px}
.r3{animation:spin 6s linear infinite;transform-origin:150px 150px}
#core.listening .r3{animation-duration:1.2s}
#core.thinking .r1{animation-duration:3s}
#coreLabel{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:Orbitron;letter-spacing:6px;font-size:30px;color:#e6fbff;text-shadow:0 0 14px var(--c);pointer-events:none}
#coreState{position:absolute;left:0;right:0;top:calc(50% + 28px);text-align:center;font-size:13px;letter-spacing:3px;opacity:.75;pointer-events:none}
#transcript{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:640px;top:552px;text-align:center;font-size:15px;line-height:1.45;z-index:6;pointer-events:none;padding:4px 10px;text-shadow:0 0 6px #020b1a,0 0 12px #020b1a,0 0 18px #020b1a,0 0 10px #3fd0ff55;transition:opacity .5s}
#transcript:empty{display:none}
#transcript.weg,body.ingezoomd #transcript,body.paneel #transcript{opacity:0}
#transcript .you{opacity:.6;font-size:14px}

/* dagupdate-platform */

.disc{position:absolute;left:50px;top:-50px;width:300px;height:300px;transform:rotateX(74deg);transform-style:preserve-3d}
.disc div{position:absolute;border-radius:50%;inset:0}
.d1{border:2px solid #3fd0ffaa;box-shadow:0 0 30px #3fd0ff88,inset 0 0 60px #3fd0ff44;background:radial-gradient(circle,#3fd0ff33,#03203a00 70%)}
.d2{inset:30px!important;border:6px dashed #3fd0ff77;animation:spin 10s linear infinite}
.d3{inset:65px!important;border:2px solid #3fd0ffcc;border-left-color:transparent;border-right-color:transparent;animation:spinr 4s linear infinite}
.d4{inset:105px!important;background:#3fd0ff44;box-shadow:0 0 40px #3fd0ff}
#platform:hover .d1{box-shadow:0 0 60px #3fd0ffdd,inset 0 0 80px #3fd0ff77}
#platLabel{position:absolute;left:0;right:0;top:104px;text-align:center;font-family:Orbitron;font-size:13px;letter-spacing:5px;color:#e6fbff;text-shadow:0 0 10px var(--c)}
#platLabel small{display:block;font-family:Rajdhani;letter-spacing:2px;font-size:12px;opacity:.7}

#briefPanel li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;background:var(--c);transform:rotate(45deg)}
#briefPanel li.w::before{background:var(--warn)}
#chPanel{left:1090px;top:100px;width:490px;height:680px;overflow:auto;z-index:20;transition:opacity .4s,transform .4s;padding:34px 22px 18px}
#chPanel.off{opacity:0;pointer-events:none;transform:translateX(30px)}

#chPanel .tabs{display:flex;gap:6px;flex-wrap:wrap}
#chPanel .tab,#chPanel .btn{font-family:Orbitron;font-size:10px;letter-spacing:1.5px;padding:5px 9px;border:1px solid #3fd0ff44;cursor:pointer;color:var(--txt);text-decoration:none;display:inline-block}
#chPanel .tab.on,#chPanel .tab:hover,#chPanel .btn:hover{background:#3fd0ff22;border-color:var(--c);color:#e6fbff}
#chPanel .btns{display:flex;gap:8px;margin-top:14px}

#chPanel .sv{font-family:Orbitron;font-size:19px;color:#e6fbff;line-height:1.3}

  const e=add(`<div class="qbtn" style="left:${b.x??k.x}px;top:${b.y??k.y+70+i*30}px">${String(b.tekst).replace(/[&<>"]/g,"").toUpperCase()}</div>`,k.id);

/* ---- Zoom ---- */
let zoomed=null;
function zoomTo(k){
  zoomed=k;const s=1.5;
  world.style.transform=`translate(${560-k.x*s}px,${450-k.y*s}px) scale(${s})`;
  world.querySelectorAll('.fade').forEach(e=>{const c=e.dataset.ch;e.classList.toggle('hidden',!(c===k.id&&e.classList.contains('node')||c==='sub-'+k.id))});
  document.getElementById('back').classList.remove('off');
  document.getElementById('crumb').textContent='PROCESVLOT / '+k.label;
  log('Kanaal geopend: '+k.label);openPanel(k);document.body.classList.add('ingezoomd');
}
function zoomOut(){
  zoomed=null;world.style.transform='';
  world.querySelectorAll('.fade').forEach(e=>e.classList.toggle('hidden',(e.dataset.ch||'').startsWith('sub-')));
  document.getElementById('back').classList.add('off');document.getElementById('crumb').textContent='';cp.classList.add('off');cpK=null;document.body.classList.remove('ingezoomd');
}
document.getElementById('back').onclick=zoomOut;
addEventListener('keydown',e=>{if(e.key==='Escape'){zoomOut();bp.classList.add('off'),document.body.classList.remove('paneel')}});

/* ---- Spraak ---- */
const core=document.getElementById('core'),state=document.getElementById('coreState'),tr=document.getElementById('transcript');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
function setState(s,t){core.className=s;state.textContent=t}
/* Stem: in Edge zijn de natuurlijke (neurale) stemmen gratis. Wisselen: zeg "stem Maarten", "stem Colette" of "stem Fenna" */
let stemNaam=null;try{stemNaam=localStorage.getItem('vlotStem')}catch{}
function voice(){const v=speechSynthesis.getVoices().filter(x=>/^nl/i.test(x.lang)),nat=v.filter(x=>/Natural|Online/i.test(x.name));
  const zoek=n=>nat.find(x=>x.name.includes(n))||v.find(x=>x.name.includes(n));
  return (stemNaam&&zoek(stemNaam))||CONFIG.stem.voorkeur.map(zoek).find(Boolean)||nat[0]||v.find(x=>/Microsoft/i.test(x.name))||v[0]}
speechSynthesis.onvoiceschanged=()=>{const v=voice();if(v)log('Stem: '+v.name.replace(/Microsoft |Online |\(Natural\)| - .*/g,'').trim())};
/* Muziek zachter (of op pauze) zolang VLOT luistert of praat */
let geduckt=false,sayId=0,trTimer=null;
function duck(){if(geduckt||!SPO.speelt)return Promise.resolve();geduckt=true;return api('/api/spotify/duck','POST').catch(()=>{})}
function unduck(geenPlay){if(!geduckt)return Promise.resolve();geduckt=false;return api('/api/spotify/unduck','POST',{geenPlay:!!geenPlay}).then(()=>setTimeout(spLoad,600)).catch(()=>{})}
function say(t,show=true){
  clearTimeout(trTimer);tr.classList.remove('weg');tr.innerHTML=show?t:'';speechSynthesis.cancel();duck();
  /* alleen het eigen antwoord uitspreken, niet wat de gebruiker zei */
  const tekst=t.replace(/<div class="you">[\s\S]*?<\/div>/g,'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').trim(),v=voice();
  /* per zin uitspreken: begint sneller en online stemmen breken lange teksten anders af */
  const zinnen=tekst.match(/[^.!?]+[.!?]*\s*/g)||[tekst],id=++sayId,klaar=()=>{if(id!==sayId)return;setState('','KLIK OM TE PRATEN');unduck();trTimer=setTimeout(()=>{tr.classList.add('weg');setTimeout(()=>{if(id===sayId)tr.innerHTML=''},600)},7000)};
  zinnen.forEach((z,i)=>{const u=new SpeechSynthesisUtterance(z.trim());u.lang='nl-NL';if(v)u.voice=v;u.rate=CONFIG.stem.snelheid;u.pitch=CONFIG.stem.toon;
    if(i===0)u.onstart=()=>setState('thinking','SPREEKT');if(i===zinnen.length-1){u.onend=klaar;u.onerror=klaar}speechSynthesis.speak(u)});
}
core.onclick=()=>{
  if(!SR){answer('Wat staat er vandaag op de planning?');return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang='nl-NL';rec.interimResults=true;
  let gehoord=false;
  rec.onstart=()=>{listening=true;setState('listening','LUISTERT…');duck()};
  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join('');tr.innerHTML=`<div class="you">${t}</div>`;if(e.results[e.results.length-1].isFinal){gehoord=true;answer(t)}};
  rec.onend=()=>{listening=false;if(core.className==='listening')setState('','KLIK OM TE PRATEN');if(!gehoord)unduck()};
  rec.start();
};
function answer(t){
  setState('thinking','DENKT NA…');log('Vraag: '+t);duck();
  const k=CONFIG.kanalen.find(k=>t.toLowerCase().includes(k.label.toLowerCase().split(' ')[0]));
  const tl=t.toLowerCase();
  if(k&&/^(open|ga naar|toon|laat .* zien)/.test(tl)){say(`${k.label[0]+k.label.slice(1).toLowerCase()}, meneer.`);zoomTo(k);return}
  if(/dagupdate|update van vandaag|wat moet ik vandaag/.test(tl)){openBrief();return}
  if(/weekoverzicht|overzicht van de week|hoe was (mijn|de) week/.test(tl)){openWeek();return}
  const sm=tl.match(/\bstem (fenna|colette|maarten)\b/);if(sm){stemNaam=sm[1][0].toUpperCase()+sm[1].slice(1);try{localStorage.setItem('vlotStem',stemNaam)}catch{};say(voice()?.name.includes(stemNaam)?`Hoi, ik ben ${stemNaam}. Zo klink ik vanaf nu.`:`De stem ${stemNaam} is hier niet beschikbaar. Open VLOT via het dashboard in Edge.`);return}
  if(/^(terug|sluit|uitzoomen)/.test(tl)){zoomOut();bp.classList.add('off'),document.body.classList.remove('paneel');say('Zoals u wilt.');return}
  if(SPO.gekoppeld){
    if(/volgende (nummer|liedje)|skip/.test(tl)){unduck().then(()=>spDo('next'));setState('','KLIK OM TE PRATEN');return}
    if(/vorige (nummer|liedje)/.test(tl)){unduck().then(()=>spDo('previous'));setState('','KLIK OM TE PRATEN');return}
    if(/^(pauze|pauzeer|stop (de )?muziek|muziek uit)/.test(tl)){unduck(true).then(()=>spDo('pause'));setState('','KLIK OM TE PRATEN');return}
    if(/^(speel( verder)?|muziek aan|play)$/.test(tl)){unduck().then(()=>spDo('play'));setState('','KLIK OM TE PRATEN');return}
    if(/wat (speelt|hoor ik)|welk (nummer|liedje)/.test(tl)){say(SPO.titel?`U luistert naar ${SPO.titel} van ${SPO.artiest}, meneer.`:'Er speelt op dit moment niets.');return}
  }
  if(!LIVE){say(`<div class="you">${esc(t)}</div>Daarvoor moet ik via het dashboard gestart zijn, meneer.`);return}
  api('/api/ask','POST',{tekst:t,kanaal:zoomed?.id}).then(r=>{say(`<div class="you">${esc(t)}</div>${esc(r.antwoord)}`);load()}).catch(()=>say('Ik kan de VLOT-server niet bereiken, meneer. Start hem via het dashboard.'));
}

/* ---- Dagupdate ---- */
const bp=document.getElementById('briefPanel');
function groet(){const h=new Date().getHours();return h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond'}
function openWeek(){const w=LIVE?.weekoverzicht;
  if(!w){say('Er is nog geen weekoverzicht, meneer. Dat verschijnt vrijdagmiddag.');return}
  document.getElementById('briefBody').innerHTML=`<div class="k" style="font-size:18px;letter-spacing:2px">WEEKOVERZICHT · ${esc(w.week)}</div><p style="font-size:16px;opacity:.85">${esc(w.samenvatting||'')}</p><h3>WAT ER VERANDERDE</h3><ul>${(w.punten||[]).map(p=>'<li>'+esc(p)+'</li>').join('')}</ul>${(w.aandacht||[]).length?'<h3>VOLGENDE WEEK</h3><ul>'+w.aandacht.map(p=>'<li class="w">'+esc(p)+'</li>').join('')+'</ul>':''}`;
  bp.classList.remove('off');document.body.classList.add('paneel');say(`Het weekoverzicht, meneer. ${w.samenvatting||''} ${(w.punten||[]).join('. ')}.${(w.aandacht||[]).length?' Voor volgende week: '+w.aandacht.join('. ')+'.':''}`,false)}
const kNaam=id=>{const k=CONFIG.kanalen.find(k=>k.id===id)?.label||id;return k[0]+k.slice(1).toLowerCase()};
function openBrief(){
  (LIVE?.waarschuwingen||[]).forEach(w=>{if(!BRIEF.let.includes(w.tekst))BRIEF.let.push(w.tekst)});
  const ops=LIVE?.opdrachten||[],gedaan=ops.filter(o=>o.status==='klaar'&&Date.now()-Date.parse(o.aangemaakt)<864e5),lopend=ops.filter(o=>o.status!=='klaar'&&Date.now()-Date.parse(o.aangemaakt)<3*864e5);
  const kl=LIVE?.klanten;if(kl?.nabellen&&!BRIEF.vandaag.some(x=>/nabellen/i.test(x)))BRIEF.vandaag.unshift(`${kl.nabellen} bedrijven nabellen, te beginnen met ${kl.nuBellen.slice(0,2).map(x=>x.naam).join(' en ')}`);
  const L=a=>a.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('briefBody').innerHTML=`<div class="k" style="font-size:18px;letter-spacing:2px">${new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</div>
   <h3>VANDAAG TE DOEN</h3><ul>${L(BRIEF.vandaag)}</ul><h3>WAT ER IS VERANDERD</h3><ul>${L(BRIEF.veranderd)}</ul>
   <h3>LET OP</h3><ul>${BRIEF.let.map(x=>`<li class="w">${x}</li>`).join('')}</ul>${gedaan.length?`<h3>VIA VLOT GEDAAN (24 UUR)</h3><ul>${gedaan.map(o=>`<li>${esc(kNaam(o.kanaal))}: ${esc(o.resultaat)}</li>`).join('')}</ul>`:''}${lopend.length?`<h3>LOOPT NOG</h3><ul>${lopend.map(o=>`<li>${esc(kNaam(o.kanaal))}: ${esc(o.tekst.slice(0,90))}</li>`).join('')}</ul>`:''}`;
  bp.classList.remove('off');document.body.classList.add('paneel');
  const vg=gedaan.length?` Via mij is in het afgelopen etmaal ${gedaan.length===1?'één opdracht':gedaan.length+' opdrachten'} afgerond${lopend.length?', en '+(lopend.length===1?'er loopt er nog één':'er lopen er nog '+lopend.length):''}.`:lopend.length?` Er ${lopend.length===1?'loopt nog één opdracht':'lopen nog '+lopend.length+' opdrachten'} bij de chats.`:'';
  say(`${groet()}, meneer. U heeft vandaag ${BRIEF.vandaag.length} punten op de planning, te beginnen met: ${BRIEF.vandaag[0]}. Sinds de vorige update: ${BRIEF.veranderd.join('. ')}.${BRIEF.let[0]?' Eén aandachtspunt: '+BRIEF.let[0]+'.':''}${vg}`,false);
}
document.getElementById('platform').onclick=()=>bp.classList.contains('off')?openBrief():(bp.classList.add('off'),document.body.classList.remove('paneel'),speechSynthesis.cancel());
bp.querySelector('.close').onclick=()=>{bp.classList.add('off'),document.body.classList.remove('paneel');speechSynthesis.cancel()};
document.getElementById('platSub').textContent=`${BRIEF.vandaag.length} taken · ${BRIEF.veranderd.length} wijzigingen`;

/* ---- Koppelingen ---- */
const LS={ok:['','GEKOPPELD'],let:['w','LET OP'],nee:['b','NIET GEKOPPELD']};
document.getElementById('links').innerHTML=CONFIG.koppelingen.map(([n,s])=>`<div class="row"><span><span class="dot ${LS[s][0]}"></span>${n}</span><span class="mono ${s==='ok'?'up':'down'}">${LS[s][1]}</span></div>`).join('');

/* ---- Feed, log, klok, balken ---- */
const fl=document.getElementById('feedList');
function log(t){const d=document.createElement('div');d.style.animation='fadein .6s';d.textContent=new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+'  '+t;fl.prepend(d);while(fl.children.length>7)fl.lastChild.remove()}
['Systeem opgestart','Make-status opgehaald','Agenda gesynchroniseerd','Mail gecontroleerd'].forEach(log);
function tick(){const d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('nl-NL');document.getElementById('date').textContent=d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}
setInterval(tick,1000);tick();
const SB=[["CPU",30],["RAM",58],["NET",44]];
document.getElementById('bars').innerHTML=SB.map(([n,v])=>`<div class="row mono" style="padding:0"><span>${n}</span></div><div class="minibar"><i style="width:${v}%"></i></div>`).join('');
setInterval(()=>document.querySelectorAll('#bars i').forEach((b,i)=>{b.style.width=Math.max(5,Math.min(100,SB[i][1]+(Math.random()*16-8)))+'%'}),1500);

/* ---- Live data van de VLOT-server (data/state.json, todos.json, kpis.json) ---- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LIVE=null,kpiScore=.75,AG=[],opsGezien=null,meldStraks=null;
function markeer(ids){try{const g=JSON.parse(localStorage.getItem('vlotGemeld')||'[]');localStorage.setItem('vlotGemeld',JSON.stringify([...g,...ids].slice(-300)))}catch{}}
addEventListener('pointerdown',()=>{if(meldStraks){const m=meldStraks;meldStraks=null;markeer(m.ids);setTimeout(()=>say(m.tekst),400)}},true);
function renderKoppelingen(){document.getElementById('links').innerHTML=CONFIG.koppelingen.map(([n,s])=>`<div class="row"><span><span class="dot ${LS[s][0]}"></span>${n}</span><span class="mono ${s==='ok'?'up':'down'}">${LS[s][1]}</span></div>`).join('')}
function setBadge(id,n){const k=CONFIG.kanalen.find(k=>k.id===id);if(!k)return;let b=k.el.querySelector('.badge');if(!n){b&&b.remove();return}if(!b){b=document.createElement('span');b.className='badge';k.el.querySelector('.ring').prepend(b)}b.textContent=n}
function render(d){
  LIVE=d;
  if(d.brief){BRIEF.vandaag=d.brief.vandaag||[];BRIEF.veranderd=d.brief.veranderd||[];BRIEF.let=d.brief.let||[]}
  document.getElementById('platSub').textContent=`${BRIEF.vandaag.length} taken · ${BRIEF.veranderd.length} wijzigingen`;
  if(d.koppelingen){const claude=d.claude==='nee'?'nee':d.claude==='let'?'let':d.claude==='ok'?'ok':'let';
    CONFIG.koppelingen=d.koppelingen.map(([n,s])=>n.startsWith('Claude')?[n,claude]:n.startsWith('Spotify')&&analyser?[n,'ok']:[n,s]);renderKoppelingen()}
  if(d.make){const sc=d.make.scenarios||[];document.getElementById('scen').innerHTML=sc.slice(0,4).map(s=>`<div class="row" style="font-size:13px"><span><span class="dot ${LS[s.status]?.[0]??''}"></span>${esc(s.naam)}</span><span class="mono">${esc(s.label)}</span></div>`).join('');
    setBadge('make',sc.filter(s=>s.status==='nee').length)}
  if(d.mail){document.getElementById('mailn').textContent=d.mail.ongelezen;document.getElementById('maill').innerHTML=(d.mail.recent||[]).slice(0,4).map(m=>'▸ '+esc(m.onderwerp)).join('<br>');
    setBadge('mail',d.mail.ongelezen);CONFIG.kanalen.find(k=>k.id==='mail').el.querySelector('.sub').textContent=d.mail.ongelezen?d.mail.ongelezen+' nieuw':'inbox leeg'}
  if(d.agenda){const td=new Date().toISOString().slice(0,10),h=s=>{const[a,b]=s.split(':');return +a+b/60};
    const vandaag=d.agenda.filter(a=>a.dag===td);AG=(vandaag.length?vandaag:d.agenda.slice(0,3)).slice(0,3).map(a=>[h(a.start),h(a.eind),(a.dag===td?'':a.dag.slice(8)+'/'+a.dag.slice(5,7)+' ')+a.titel]);
    CONFIG.kanalen.find(k=>k.id==='agenda').el.querySelector('.sub').textContent='vandaag '+vandaag.length;agDraw()}
  const todos=(d.todos||[]).filter(t=>!t.klaar);
  document.getElementById('todo').innerHTML=todos.slice(0,5).map(t=>`<div class="row" style="padding:1px 0;cursor:pointer" data-id="${t.id}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px"><span class="dot ${t.bron==='voorstel'?'w':''}"></span>${esc(t.tekst)}</span><span class="mono">${esc(t.kanaal).slice(0,4).toUpperCase()}</span></div>`).join('')||'<div class="mono">Alles gedaan</div>';
  document.querySelectorAll('#todo [data-id]').forEach(r=>r.onclick=()=>api('/api/todo/'+r.dataset.id,'PATCH').then(()=>{log('Taak afgevinkt');load()}));
  document.getElementById('omz').textContent=todos.length;document.getElementById('omzb').style.width=Math.min(100,todos.length*10)+'%';
  const kp=d.kpis||[];
  document.getElementById('kpi').innerHTML=kp.filter(k=>k.hoofd).slice(0,6).map(k=>{const v=k.waarde,p=v==null?0:k.lagerIsBeter?(v<=k.doel?1:Math.max(0,1-(v-k.doel)/5)):Math.min(1,v/k.doel);
    return `<div class="row" style="padding:0"><span>${esc(k.naam)}</span><span class="mono">${v??'–'} / ${k.doel}</span></div><div class="minibar" style="margin:1px 0 2px"><i style="width:${p*100}%${p<.5?';background:var(--warn)':''}"></i></div>`}).join('');
  const met=kp.filter(k=>k.hoofd&&k.waarde!=null&&k.doel!=null);kpiScore=met.length?met.reduce((s,k)=>s+(k.lagerIsBeter?(k.waarde<=k.doel?1:0):Math.min(1,k.waarde/k.doel)),0)/met.length:0;
  const pil=kp.find(k=>/pilot/i.test(k.naam));if(pil){document.getElementById('pil').textContent=pil.waarde??'–';document.getElementById('pild').textContent='DOEL '+pil.doel}
  if(d.klanten&&!d.klanten.fout){setBadge('algemeen',d.klanten.nabellen);CONFIG.kanalen.find(k=>k.id==='algemeen').el.querySelector('.sub').textContent=d.klanten.nabellen?d.klanten.nabellen+' nabellen':'bedrijf'}
  if(d.socials&&!d.socials.fout){SOC=d.socials;const mn=document.getElementById('mktnote');mn.textContent='BEREIK PER DAG · 28 D';mn.className='mono';mn.style.opacity=.5;mkt()}
  if(cpK&&!cp.contains(document.activeElement))renderPanel();
  /* waarschuwingen + nieuw weekoverzicht: één keer melden. Browsers laten spraak pas toe na een klik, dus zo nodig wacht het tot de eerste klik */
  let gez=[];try{gez=JSON.parse(localStorage.getItem('vlotGemeld')||'[]')}catch{}
  const wo=d.weekoverzicht,meld=[...(d.waarschuwingen||[])];if(wo?.week&&Date.now()-Date.parse(wo.gemaakt)<4*864e5)meld.push({id:'week-'+wo.week,tekst:'Het weekoverzicht staat klaar. Zeg weekoverzicht om het te horen',week:true});
  const nieuw=meld.filter(w=>!gez.includes(w.id)&&!meldStraks?.ids.includes(w.id));
  if(nieuw.length){nieuw.forEach(w=>log((w.week?'Weekoverzicht klaar':'Let op: ')+(w.week?'':w.tekst.slice(0,55))));
    const tekst=(nieuw.length>1?'Meneer, '+nieuw.length+' punten. ':'Meneer. ')+nieuw.map(w=>w.tekst).join('. ')+'.';
    const ids=nieuw.map(w=>w.id);
    if(navigator.userActivation?.hasBeenActive&&!speechSynthesis.speaking){say(tekst);markeer(ids)}else meldStraks={tekst,ids}}
  /* opdrachten die VLOT heeft doorgezet naar een chat: status volgen en resultaat melden */
  const ops=d.opdrachten||[];
  if(opsGezien===null){opsGezien={};ops.forEach(o=>opsGezien[o.id]=o.status)}
  else ops.forEach(o=>{if(opsGezien[o.id]===o.status)return;opsGezien[o.id]=o.status;const kn=CONFIG.kanalen.find(k=>k.id===o.kanaal)?.label||o.kanaal;
    if(o.status==='nieuw')log(d.doorsturen?'Opdracht klaargezet: '+kn:'Opdracht wacht: de assistent luistert niet');
    else if(o.status==='doorgezet')log('Doorgezet naar '+kn);
    else if(o.status==='klaar'){log(kn+' klaar: '+o.resultaat.slice(0,50));if(!speechSynthesis.speaking)say('Bericht van '+kn.toLowerCase()+', meneer. '+o.resultaat)}});
}
function api(u,m='GET',b){return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json())}
let lastUpd='';
/* zolang er een opdracht loopt vaker kijken of hij klaar is */
setInterval(()=>{if((LIVE?.opdrachten||[]).some(o=>o.status!=='klaar'&&Date.now()-Date.parse(o.aangemaakt)<6*3600e3))load()},10000);
function load(){api('/api/state').then(d=>{render(d);if(d.bijgewerkt&&d.bijgewerkt!==lastUpd){if(lastUpd)log('Gegevens ververst');lastUpd=d.bijgewerkt}}).catch(()=>{})}
/* ---- Spotify: nu aan het spelen + bediening ---- */
let SPO={gekoppeld:false},spLastTrack='';
function spLoad(){api('/api/spotify').then(s=>{SPO=s;
  const T=document.getElementById('spTitel'),A=document.getElementById('spArt'),C=document.getElementById('spCover');
  document.getElementById('spCtl').style.display=s.gekoppeld?'inline':'none';
  if(!s.gekoppeld){T.textContent='SPOTIFY';A.textContent=s.reden==='geen-client-id'?'Client ID ontbreekt':'klik om te koppelen';C.style.display='none'}
  else if(!s.titel){T.textContent='ER SPEELT NIETS';A.textContent='';C.style.display='none';document.getElementById('spBar').style.width='0%'}
  else{T.textContent=s.titel;A.textContent=s.artiest||'';if(s.cover){C.src=s.cover;C.style.display='block'}
    document.getElementById('spBar').style.width=(s.voortgang/s.duur*100)+'%';document.getElementById('spPP').innerHTML=s.speelt?'&#10074;&#10074;':'&#9654;';
    if(s.titel!==spLastTrack){if(spLastTrack)log('Speelt: '+s.titel);spLastTrack=s.titel}}

      <input id="cpIn" placeholder="+ taak toevoegen aan ${esc(k.label.toLowerCase())} (Enter)">`:''}
    <div class="btns"><span class="btn" data-b="vraag">&#9673; VRAAG VLOT</span><span class="btn" data-b="chat">&#8599; OPEN CHAT</span></div>`;
  if(w==='socials')socDraw();
  cp.querySelectorAll('.tab').forEach(e=>e.onclick=()=>openPanel(k,e.dataset.i<0?null:k.opties[e.dataset.i]));
  cp.querySelectorAll('#cpBody [data-id]').forEach(r=>r.onclick=()=>api('/api/todo/'+r.dataset.id,'PATCH').then(()=>{log('Taak afgevinkt');load()}));
  const inp=document.getElementById('cpIn');if(inp)inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){api('/api/todo','POST',{tekst:inp.value.trim(),kanaal:k.id}).then(()=>{inp.blur();load()});log('Taak toegevoegd');inp.value=''}};
  const vb=cp.querySelector('[data-b=vertel]');if(vb)vb.onclick=()=>say(VERTEL[o.vertel](o));
  if(w==='invoer')invoerKlaar(k,o);if(w==='fouten')foutenKlaar();
  cp.querySelector('[data-b=vraag]').onclick=()=>answer(o.vraag||`Geef me een korte update over ${k.label.toLowerCase()}.`);
  cp.querySelector('[data-b=chat]').onclick=()=>{say('In de demo is er geen chat. In jouw eigen dashboard opent deze knop de bijbehorende omgeving.')};
}

/* ---- Kleine grafieken ---- */const C='#3fd0ff',WN='#ffb347';
function ctx(id){return document.getElementById(id).getContext('2d')}
let ig=Array.from({length:20},(_,i)=>800+i*25+Math.random()*120),fb=Array.from({length:20},(_,i)=>900-i*8+Math.random()*90);
function line(g,arr,col,mn,mx,w,h){g.strokeStyle=col;g.lineWidth=1.6;g.beginPath();arr.forEach((v,i)=>{const x=i*w/(arr.length-1),y=h-4-(v-mn)/(mx-mn)*(h-8);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fillStyle=col+'18';g.fill()}
let SOC=null;
function mkt(){const g=ctx('mktc');g.clearRect(0,0,266,70);
  let n1=ig.at(-1),n2=fb.at(-1),p1,p2;const pc=a=>a[0]?((a[a.length-1]-a[0])/a[0]*100):0,dl=(a,b)=>b?(a-b)/b*100:null;
  if(SOC){const r=(x,k)=>(x?.reeks?.[k]||[]).map(p=>p.v);ig=r(SOC.ig,'bereik');fb=r(SOC.fb,'weergaven');if(ig.length<2)ig=[0,0];if(fb.length<2)fb=[0,0];
    n1=SOC.ig?.week?.views??0;n2=SOC.fb?.week?.weergaven??0;p1=dl(n1,SOC.ig?.vorige?.views);p2=dl(n2,SOC.fb?.vorige?.weergaven)}
  else{p1=pc(ig);p2=pc(fb)}
  const all=[...ig,...fb],mn=SOC?0:Math.min(...all)-50,mx=Math.max(...all,SOC?5:0)+(SOC?2:50);
  g.strokeStyle='#3fd0ff22';for(let y=0;y<70;y+=14){g.beginPath();g.moveTo(0,y);g.lineTo(266,y);g.stroke()}
  line(g,ig,C,mn,mx,266,70);line(g,fb,WN,mn,mx,266,70);
  document.getElementById('igv').textContent=Math.round(n1).toLocaleString('nl-NL');
  document.getElementById('fbv').textContent=Math.round(n2).toLocaleString('nl-NL');
  const zet=(id,p)=>{const e=document.getElementById(id);e.textContent=p==null?'nieuw':(p>=0?'▲ ':'▼ ')+Math.abs(p).toFixed(0)+'%';e.className=(p==null||p>=0?'up':'down')+' mono';e.title='t.o.v. vorige week'};
  zet('igp',p1);zet('fbp',p2);}setInterval(()=>{if(SOC)return;ig.shift();ig.push(ig.at(-1)+Math.random()*80-25);fb.shift();fb.push(fb.at(-1)+Math.random()*60-38);mkt()},2500);mkt();
let ops=Array.from({length:24},()=>Math.random());
function opsDraw(){const g=ctx('opsc');g.clearRect(0,0,266,40);ops.forEach((v,i)=>{g.fillStyle=i===ops.length-1?WN:C;g.globalAlpha=.4+v*.6;g.fillRect(i*11,40-v*38,8,v*38)});g.globalAlpha=1}
setInterval(()=>{ops.shift();ops.push(Math.random());opsDraw()},1800);opsDraw();
AG=[[10,10.75,'Belafspraak klant'],[13.5,15,'Enquête nabellen'],[16,16.5,'Post controleren']];
function agDraw(){const g=ctx('agc');g.clearRect(0,0,266,122);const h0=8,h1=21,X=h=>(h-h0)/(h1-h0)*262+2;
  g.font='11px "Share Tech Mono", monospace';g.fillStyle='#cfefff99';
  for(let h=h0;h<=h1;h+=2){g.fillText(h,X(h)-6,118);g.fillStyle='#3fd0ff22';g.fillRect(X(h),0,1,104);g.fillStyle='#cfefff99'}
  AG.forEach(([a,b,t],i)=>{const y=8+i*32;g.fillStyle='#3fd0ff33';g.fillRect(X(a),y,X(b)-X(a),22);g.strokeStyle=C;g.strokeRect(X(a),y,X(b)-X(a),22);g.fillStyle='#e6fbff';g.font='500 13px Rajdhani, sans-serif';g.fillText(t.slice(0,34),X(a)<130?X(a)+4:4,y+15)});
  const n=new Date(),hh=n.getHours()+n.getMinutes()/60;if(hh>=h0&&hh<=h1){g.fillStyle=WN;g.fillRect(X(hh),0,2,104)}}
agDraw();setInterval(agDraw,30000);
let net=Array.from({length:60},()=>.5);
function netDraw(){const g=ctx('netc');g.clearRect(0,0,266,84);net.shift();net.push(Math.max(.05,Math.min(.95,net.at(-1)+Math.random()*.3-.15)));
  g.strokeStyle=C;g.beginPath();net.forEach((v,i)=>{const x=i*266/59,y=84-v*80;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  g.strokeStyle=WN;g.globalAlpha=.6;g.beginPath();net.forEach((v,i)=>{const x=i*266/59,y=84-(1-v)*50-10;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.globalAlpha=1}
setInterval(netDraw,200);
let ang=0;
function radarGauge(){
  let g=ctx('radar');g.clearRect(0,0,120,120);g.strokeStyle='#3fd0ff55';
  [20,38,56].forEach(r=>{g.beginPath();g.arc(60,60,r,0,7);g.stroke()});g.beginPath();g.moveTo(4,60);g.lineTo(116,60);g.moveTo(60,4);g.lineTo(60,116);g.stroke();
  g.fillStyle='#3fd0ff44';g.beginPath();g.moveTo(60,60);g.arc(60,60,56,ang,ang+.6);g.closePath();g.fill();
  g.fillStyle=C;[[.3,30],[2.1,44],[4,24]].forEach(([a,r])=>{const d=((ang-a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);g.globalAlpha=Math.max(0,1-d/4);g.beginPath();g.arc(60+Math.cos(a)*r,60+Math.sin(a)*r,3,0,7);g.fill()});g.globalAlpha=1;
  g=ctx('gauge');g.clearRect(0,0,120,120);const v=Math.max(0,Math.min(1,kpiScore+Math.sin(ang*.7)*.01));
  g.lineWidth=8;g.strokeStyle='#0e3a5c';g.beginPath();g.arc(60,60,48,Math.PI*.75,Math.PI*2.25);g.stroke();
  g.strokeStyle=C;g.beginPath();g.arc(60,60,48,Math.PI*.75,Math.PI*(.75+1.5*v));g.stroke();g.lineWidth=1;
  g.strokeStyle='#3fd0ff66';g.beginPath();g.arc(60,60,36,ang,ang+4);g.stroke();
  g.fillStyle='#e6fbff';g.font='18px Orbitron';g.textAlign='center';g.fillText(Math.round(v*100)+'%',60,66);g.font='9px Orbitron';g.fillText('DOELEN',60,82);g.textAlign='left';
  ang+=.03;requestAnimationFrame(radarGauge)}
radarGauge();

/* ---- Pulse van kern ---- */
/* rustig ademende ring: rust = langzaam (5 s), luisteren/praten = iets ruimer, zonder schokken */
const pulseEl=document.getElementById('pulse');let pAmp=2.5,pSpd=1.25,pPh=0,pT=performance.now();
(function pl(now){const dt=Math.min(.05,(now-pT)/1000);pT=now;
  const doelA=core.className==='listening'?5:core.className==='thinking'?4:2.5,doelS=core.className?2:1.25;
  pAmp+=(doelA-pAmp)*dt*1.5;pSpd+=(doelS-pSpd)*dt*1.5;pPh+=dt*pSpd;
  const s=(1-Math.cos(pPh))/2;pulseEl.setAttribute('r',(68+s*pAmp).toFixed(2));pulseEl.setAttribute('fill-opacity',(.04+s*.05).toFixed(3));
  requestAnimationFrame(pl)})(pT);

/* ---- Equalizer (stippen) – reageert op systeemgeluid / Spotify ---- */
const eq=document.getElementById('eq').getContext('2d'),COLS=170,SP=1600/COLS;let analyser=null,fbuf=null,lvl=new Array(COLS).fill(0),t0=0;
async function koppelAudio(){
  try{const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    if(!s.getAudioTracks().length){say('Vink bij het delen systeemaudio delen aan, meneer, dan beweeg ik mee op uw muziek.');s.getTracks().forEach(t=>t.stop());return}
    s.getVideoTracks().forEach(t=>t.stop());
    const ac=new AudioContext(),src=ac.createMediaStreamSource(s);analyser=ac.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.75;src.connect(analyser);fbuf=new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('eqLabel').textContent='AUDIO · LIVE';
    CONFIG.koppelingen.find(k=>k[0].startsWith('Spotify'))[1]='ok';document.getElementById('links').innerHTML=CONFIG.koppelingen.map(([n,s])=>`<div class="row"><span><span class="dot ${LS[s][0]}"></span>${n}</span><span class="mono ${s==='ok'?'up':'down'}">${LS[s][1]}</span></div>`).join('');
    log('Audio gekoppeld');
  }catch(e){log('Audio koppelen geannuleerd')}
}

let beat=0,bassAvg=0,lastBeat=0;const TT=document.getElementById('spTitel');
(function eqDraw(){
  t0+=.02;eq.clearRect(0,0,1600,200);
  if(analyser){analyser.getByteFrequencyData(fbuf);
    /* beat: plotselinge piek in de bas (laagste frequenties) t.o.v. het lopende gemiddelde */
    let b=0;for(let k=0;k<6;k++)b+=fbuf[k];b/=6*255;bassAvg+=(b-bassAvg)*.05;
    const nu=performance.now();if(b>.3&&b>bassAvg*1.25&&nu-lastBeat>260){beat=1;lastBeat=nu}}
  beat*=.9;TT.style.textShadow=`0 0 ${4+beat*18}px rgba(63,208,255,${.4+beat*.6})`;
  const base=110-beat*6;
  for(let i=0;i<COLS;i++){
    const m=Math.abs(i-COLS/2)/(COLS/2);let target;
    if(analyser){const bin=Math.floor(Math.pow(m,1.6)*fbuf.length*.7);target=fbuf[bin]/255}
    else target=.12+.1*Math.sin(i*.15+t0*2)*Math.sin(i*.04-t0)+.06*Math.sin(i*.6+t0*3);
    lvl[i]+=(Math.max(0,target)-lvl[i])*.3;
    const rows=Math.min(15,Math.round(lvl[i]*12*(1+beat*.35))),x=i*SP+SP/2;
    for(let r=0;r<rows;r++){const y=base-r*4.6;eq.globalAlpha=.25+.75*(r/12);eq.fillStyle=r>rows-3?'#e6fbff':C;eq.beginPath();eq.arc(x,y,1.9,0,7);eq.fill()}
    for(let r=1;r<rows*.6;r++){const y=base+r*4.6;eq.globalAlpha=.3*(1-r/(rows*.6));eq.fillStyle=C;eq.beginPath();eq.arc(x,y,1.9,0,7);eq.fill()}
  }
  eq.globalAlpha=1;requestAnimationFrame(eqDraw)})();

/* ---- Achtergrond: raster, circuitbanen met pulsen, deeltjes, eigen afbeeldingen ---- */
const cv=document.getElementById('bg'),g=cv.getContext('2d');let pts=[],tracks=[],pulses=[],imgs=[],imgI=0,imgA=0;
CONFIG.achtergrond.forEach(f=>{const im=new Image();im.src='achtergrond/'+f;imgs.push(im)});
function rs(){cv.width=innerWidth;cv.height=innerHeight;
  pts=Array.from({length:110},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12}));
  tracks=Array.from({length:45},()=>{let x=Math.round(Math.random()*cv.width/20)*20,y=Math.round(Math.random()*cv.height/20)*20;const p=[[x,y]];
    for(let s=0;s<4+Math.random()*4;s++){const l=(2+Math.random()*8)*20;Math.random()<.5?x+=Math.random()<.5?l:-l:y+=Math.random()<.5?l:-l;p.push([x,y])}return p});
  pulses=tracks.map((t,i)=>({t:i,pos:Math.random()}))}
rs();addEventListener('resize',rs);let sc=0,wt=0;
function along(p,f){let L=0;const seg=[];for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);seg.push(d);L+=d}
  let d=f*L;for(let i=0;i<seg.length;i++){if(d<=seg[i]){const k=d/seg[i];return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}d-=seg[i]}return p.at(-1)}
(function bg(){const W=cv.width,H=cv.height;g.fillStyle='#020b1a';g.fillRect(0,0,W,H);
  if(imgs.length&&imgs[imgI].complete){imgA+=.002;const im=imgs[imgI],s=Math.max(W/im.width,H/im.height);g.globalAlpha=.22*Math.sin(Math.min(imgA,1)*Math.PI);
    g.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s);g.globalAlpha=1;if(imgA>=1){imgA=0;imgI=(imgI+1)%imgs.length}}
  wt+=.0035;const GX=150,GY=80;
  for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){const u=i/(GX-1),v=j/(GY-1);
    const z=Math.sin(u*5+wt*2+Math.sin(v*3+wt))*.6+Math.sin(v*7-wt*1.5+u*2)*.35+Math.sin((u+v)*11+wt*3)*.12;
    const s=1/(1.25-z*.35),x=W/2+(u-.5)*W*1.15*s,y=H/2+(v-.5)*H*1.1*s+z*25;
    const a=Math.max(0,Math.min(1,(z+1)/2));g.fillStyle=`rgba(${120+a*120|0},${210+a*45|0},255,${.04+a*.22})`;g.fillRect(x,y,1.3+a,1.3+a)}
  g.strokeStyle='rgba(63,208,255,.05)';g.lineWidth=1;
  for(let x=0;x<W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=0;y<H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.strokeStyle='rgba(63,208,255,.14)';tracks.forEach(p=>{g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    g.fillStyle='rgba(63,208,255,.35)';g.beginPath();g.arc(p.at(-1)[0],p.at(-1)[1],2.5,0,7);g.fill()});
  pulses.forEach(q=>{q.pos+=.0012;if(q.pos>1)q.pos=0;const [x,y]=along(tracks[q.t],q.pos);g.fillStyle='rgba(160,235,255,.9)';g.beginPath();g.arc(x,y,2,0,7);g.fill()});
  sc=(sc+1.5)%H;g.fillStyle='rgba(63,208,255,.035)';g.fillRect(0,sc,W,70);
  pts.forEach(p=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;g.fillStyle='rgba(63,208,255,.6)';g.fillRect(p.x,p.y,1.6,1.6)});
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<90){g.strokeStyle=`rgba(63,208,255,${.12*(1-d/90)})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}
  requestAnimationFrame(bg)})();

zoomOut();
load();setInterval(load,60000);spLoad();
</script>
